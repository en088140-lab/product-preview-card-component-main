<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Product preview card component</title>
  <link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:ital,wght@0,100;0,300;0,400;0,500;0,700;0,800;0,900;1,100;1,300;1,400;1,500;1,700;1,800;1,900&family=Alegreya:ital,wght@0,400..900;1,400..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:ital,wght@0,100;0,300;0,400;0,500;0,700;0,800;0,900;1,100;1,300;1,400;1,500;1,700;1,800;1,900&family=Alegreya:ital,wght@0,400..900;1,400..900&family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div class="card">
     <div class="image">
        <picture>
          <source
          media="(max-width:500px)"
          srcset="images\image-product-mobile.jpg"
          >
          <img src="images/image-product-desktop.jpg" alt="perfume_photo">

        </picture>
     </div>
     <div class="text">
        <span id="title"> PERFUME</span>
        <h2 id="title1">Gabrielle<br> Essence Eau<br> De Parfum</h2>
        <p>  A floral, solar and voluptuous<br> interpretation composed by<br> Olivier Polge, 
            Perfumer-Creator<br> for the House of CHANEL.</p>
        <div class="sale">
             <h2 > $149.99</h2> 
             <span >  $169.99</span>
        </div>
        <button ><img src="images/icon-cart.svg" alt="icon">Add to Cart  </button>
     </div>

  </div>

 





 


 
  
  <footer>
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="https://github.com/">Eman Nabil</a>.
  </footer>
</body>
</html>
